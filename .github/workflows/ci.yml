name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q src
      - name: tests (dataset tests skip automatically when AEGIS_DATASET is absent)
        run: PYTHONPATH=src pytest -q
        env: { AEGIS_DATASET: "${{ vars.AEGIS_DATASET_PATH }}" }
  release-gate:
    if: ${{ vars.AEGIS_DATASET_PATH != '' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python eval/run_eval.py "${{ vars.AEGIS_DATASET_PATH }}" && python eval/report.py && python eval/gate.py
      - uses: actions/upload-artifact@v4
        with: { name: eval-results, path: eval/results }
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aegis:ci .
